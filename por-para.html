<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Preposiciones: por / para</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef2f6;
    --paper: #ffffff;
    --ink: #14213d;
    --muted: #55627a;
    --line: #cdd6e2;
    --por: #1b5e9e;
    --por-soft: #dcebf8;
    --para: #b45309;
    --para-soft: #fdeacc;
    --ok: #166534;
    --ok-soft: #dcf3e3;
    --bad: #b42318;
    --bad-soft: #fde4e1;
    --focus: #14213d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1724;
      --paper: #182236;
      --ink: #eaf0fa;
      --muted: #a3b0c7;
      --line: #2e3c56;
      --por: #7fb6ee;
      --por-soft: #1c3350;
      --para: #f2b45f;
      --para-soft: #43301a;
      --ok: #7fdc9c;
      --ok-soft: #173a25;
      --bad: #ff9c92;
      --bad-soft: #4a201c;
      --focus: #eaf0fa;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1724;
    --paper: #182236;
    --ink: #eaf0fa;
    --muted: #a3b0c7;
    --line: #2e3c56;
    --por: #7fb6ee;
    --por-soft: #1c3350;
    --para: #f2b45f;
    --para-soft: #43301a;
    --ok: #7fdc9c;
    --ok-soft: #173a25;
    --bad: #ff9c92;
    --bad-soft: #4a201c;
    --focus: #eaf0fa;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif;
    font-size: 1.125rem;
    line-height: 1.6;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

  header h1 {
    font-family: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(2.25rem, 8vw, 3.5rem);
    line-height: 1.05;
    margin: 0 0 .75rem;
    letter-spacing: -0.02em;
  }
  header h1 .p1 { color: var(--por); }
  header h1 .p2 { color: var(--para); }
  header p { margin: 0; color: var(--muted); max-width: 36rem; }

  .guide {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
    margin: 1.75rem 0 2rem;
  }
  .guide div {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .75rem 1rem;
    font-size: .95rem;
    line-height: 1.45;
  }
  .guide b {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: 1.15rem;
    display: block;
    margin-bottom: .15rem;
  }
  .guide .g-por { border-left: 5px solid var(--por); }
  .guide .g-por b { color: var(--por); }
  .guide .g-para { border-left: 5px solid var(--para); }
  .guide .g-para b { color: var(--para); }
  @media (max-width: 480px) { .guide { grid-template-columns: 1fr; } }

  .bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    align-items: center;
    gap: .75rem;
    background: var(--bg);
    padding: .6rem 0;
    margin-bottom: .5rem;
    border-bottom: 1px solid var(--line);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: .95rem;
  }
  .track { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--ok); transition: width .3s ease; }

  ol { list-style: none; margin: 0; padding: 0; counter-reset: q; }
  li {
    counter-increment: q;
    display: flex;
    align-items: baseline;
    gap: .9rem;
    padding: .9rem 0;
    border-bottom: 1px solid var(--line);
  }
  li::before {
    content: counter(q);
    flex: none;
    width: 1.75rem;
    text-align: right;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    color: var(--muted);
  }
  .sentence { flex: 1; }
  .fb {
    display: block;
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-size: .85rem;
    font-weight: 600;
    min-height: 0;
    margin-top: .2rem;
  }

  input.blank {
    font: inherit;
    font-weight: 600;
    text-align: center;
    width: 5.25rem;
    padding: .1rem .35rem;
    margin: 0 .2rem;
    color: var(--ink);
    background: var(--paper);
    border: 0;
    border-bottom: 2.5px solid var(--ink);
    border-radius: 6px 6px 0 0;
    outline: none;
  }
  input.blank::placeholder { color: var(--line); }
  input.blank:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  li.ok input.blank { background: var(--ok-soft); border-bottom-color: var(--ok); color: var(--ok); }
  li.bad input.blank { background: var(--bad-soft); border-bottom-color: var(--bad); color: var(--bad); }
  li.ok .fb { color: var(--ok); }
  li.bad .fb { color: var(--bad); }
  li.shown input.blank { background: var(--por-soft); border-bottom-color: var(--por); color: var(--ink); }
  li.shown .fb { color: var(--muted); }

  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    margin-top: 1.75rem;
  }
  button {
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: .7rem 1.25rem;
    border-radius: 10px;
    border: 2px solid var(--ink);
    cursor: pointer;
    background: transparent;
    color: var(--ink);
    min-height: 44px;
  }
  button.primary { background: var(--ink); color: var(--bg); }
  button:hover { filter: brightness(1.15); }
  button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .result {
    margin-top: 1.5rem;
    padding: 1rem 1.25rem;
    border-radius: 10px;
    background: var(--paper);
    border: 1px solid var(--line);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    font-weight: 600;
    display: none;
  }
  .result.on { display: block; }
  .result small { display: block; font-family: "Source Serif 4", Georgia, serif; font-weight: 400; color: var(--muted); font-size: 1rem; margin-top: .15rem; }

  @media (prefers-reduced-motion: reduce) { .fill { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Preposiciones: <span class="p1">por</span> / <span class="p2">para</span></h1>
    <p>Escribe <b>por</b> o <b>para</b> en cada espacio. Cuando termines, pulsa «Comprobar».</p>
  </header>

  <section class="guide" aria-label="Recordatorio">
    <div class="g-por"><b>por</b>lugar por donde se pasa, tiempo, causa, medio, multiplicación</div>
    <div class="g-para"><b>para</b>finalidad, destinatario, destino, utilidad</div>
  </section>

  <div class="bar" role="status" aria-live="polite">
    <span id="count">0 / 14</span>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>

  <ol id="list"></ol>

  <div class="actions">
    <button class="primary" id="check" type="button">Comprobar</button>
    <button id="solution" type="button">Ver soluciones</button>
    <button id="reset" type="button">Empezar de nuevo</button>
  </div>

  <div class="result" id="result" role="status" aria-live="polite"></div>
</main>

<script>
  var items = [
    ["El sol sale ", " el este.", "por"],
    ["Necesito un lápiz ", " escribir.", "para"],
    ["Este regalo es ", " ti.", "para"],
    ["Tres ", " diez son treinta.", "por"],
    ["¿", " qué estás tan triste?", "por"],
    ["Mañana me voy ", " Italia.", "para"],
    ["Hay mucha gente ", " la calle.", "por"],
    ["Yo subiré ", " las escaleras.", "por"],
    ["Coge un vaso ", " beber.", "para"],
    ["No se ve nada ", " la noche.", "por"],
    ["¿Entró alguien ", " la puerta?", "por"],
    ["¿", " qué sirve una linterna?", "para"],
    ["Compré un libro ", " leer.", "para"],
    ["Llámame ", " teléfono.", "por"]
  ];

  var list = document.getElementById("list");
  var rows = [];

  items.forEach(function (it, i) {
    var li = document.createElement("li");
    var wrap = document.createElement("div");
    wrap.className = "sentence";
    var input = document.createElement("input");
    input.type = "text";
    input.className = "blank";
    input.setAttribute("autocomplete", "off");
    input.setAttribute("autocapitalize", "none");
    input.setAttribute("spellcheck", "false");
    input.setAttribute("aria-label", "Frase " + (i + 1) + ": escribe por o para");
    var fb = document.createElement("span");
    fb.className = "fb";
    wrap.appendChild(document.createTextNode(it[0]));
    wrap.appendChild(input);
    wrap.appendChild(document.createTextNode(it[1]));
    wrap.appendChild(fb);
    li.appendChild(wrap);
    list.appendChild(li);
    input.addEventListener("input", function () {
      clearState(i);
      updateCount();
    });
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        e.preventDefault();
        if (rows[i + 1]) rows[i + 1].input.focus(); else document.getElementById("check").focus();
      }
    });
    rows.push({ li: li, input: input, fb: fb, answer: it[2] });
  });

  function clearState(i) {
    rows[i].li.className = "";
    rows[i].fb.textContent = "";
  }

  function updateCount() {
    var done = rows.filter(function (r) { return r.input.value.trim() !== ""; }).length;
    document.getElementById("count").textContent = done + " / " + rows.length;
    document.getElementById("fill").style.width = (done / rows.length * 100) + "%";
  }

  var result = document.getElementById("result");

  document.getElementById("check").addEventListener("click", function () {
    var correct = 0, empty = 0;
    rows.forEach(function (r) {
      var v = r.input.value.trim().toLowerCase();
      r.li.className = "";
      if (v === "") { empty++; r.fb.textContent = "Falta responder"; r.li.className = "bad"; return; }
      if (v === r.answer) {
        correct++;
        r.li.className = "ok";
        r.fb.textContent = "✓ Correcto";
      } else {
        r.li.className = "bad";
        r.fb.textContent = "✗ Inténtalo otra vez";
      }
    });
    var msg;
    if (correct === rows.length) msg = "¡Perfecto! Todas correctas.";
    else if (correct >= rows.length * 0.7) msg = "¡Muy bien!";
    else msg = "Sigue practicando.";
    result.className = "result on";
    result.innerHTML = correct + " de " + rows.length + " correctas. " + msg +
      (empty ? "<small>Te faltan " + empty + " por responder.</small>" : (correct < rows.length ? "<small>Corrige las frases marcadas y vuelve a comprobar.</small>" : ""));
  });

  document.getElementById("solution").addEventListener("click", function () {
    rows.forEach(function (r) {
      r.input.value = r.answer;
      r.li.className = "shown";
      r.fb.textContent = "Solución: " + r.answer;
    });
    result.className = "result";
    updateCount();
  });

  document.getElementById("reset").addEventListener("click", function () {
    rows.forEach(function (r, i) { r.input.value = ""; clearState(i); });
    result.className = "result";
    updateCount();
    rows[0].input.focus();
  });
</script>
</body>
</html>
